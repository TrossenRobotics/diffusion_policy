name: trossen_cleaning

# C, H, W for each camera stream (recorded video is resized to this for training)
image_shape: [3, 240, 320]

# directory containing replay_buffer.zarr + videos/ recorded by demo_real_robot.py
dataset_path: data/trossen_cleaning_real

shape_meta: &shape_meta
  obs:
    # two RealSense D405 cameras
    camera_0:
      shape: ${task.image_shape}
      type: rgb
    camera_1:
      shape: ${task.image_shape}
      type: rgb
    # follower EEF pose: [x, y, z, rx, ry, rz]
    robot_eef_pose:
      shape: [6]
      type: low_dim
    # follower gripper width in meters — shape [1] matches ring buffer shape (1,)
    robot_gripper_width:
      shape: [1]
      type: low_dim
  action:
    # 7D: [x, y, z, rx, ry, rz, gripper_width]
    shape: [7]

env_runner:
  # no-op runner: real-robot evaluation is done via eval_real_robot.py
  _target_: diffusion_policy.env_runner.real_pusht_image_runner.RealPushTImageRunner

dataset:
  _target_: diffusion_policy.dataset.trossen_cleaning_image_dataset.TrossenCleaningImageDataset
  shape_meta: *shape_meta
  dataset_path: ${task.dataset_path}
  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps}-1+${n_latency_steps}'}
  pad_after: ${eval:'${n_action_steps}-1'}
  n_obs_steps: ${dataset_obs_steps}
  n_latency_steps: ${n_latency_steps}
  use_cache: True
  seed: 42
  val_ratio: 0.00
  max_train_episodes: null
  delta_action: False
